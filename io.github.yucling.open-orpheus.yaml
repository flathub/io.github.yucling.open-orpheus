app-id: io.github.yucling.open-orpheus
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: electron-wrapper
separate-locales: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=io.github.yucling.OpenOrpheus
modules:
  - name: open-orpheus
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/run/build/open-orpheus/.npm-prefix/bin:/run/build/open-orpheus/.rust/bin
      env:
        XDG_CACHE_HOME: /run/build/open-orpheus/flatpak-node/cache
        ELECTRON_OFFLINE_BUILD: "1"
    build-commands:
      - cat cargo/config >> .cargo/config.toml
      - "echo 'minimumReleaseAge: 0' >> pnpm-workspace.yaml"
      - npm install -g --ignore-scripts --omit=optional --no-audit --no-fund
        --offline --no-update-notifier --prefix
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix ./pnpm-12.18.0.tgz
      - install -d
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix/lib/node_modules/@pnpm/exe.linux-$(node
        -p process.arch)
      - tar xf pnpm-exe-*.tgz -C
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix/lib/node_modules/@pnpm/exe.linux-$(node
        -p process.arch) --strip-components=1
      - node
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix/lib/node_modules/pnpm/install.js
      - pnpm install --offline --frozen-lockfile --store-dir
        $FLATPAK_BUILDER_BUILDDIR/flatpak-node/pnpm-store
      - tar xf wasm-bindgen-*.tar.gz
      - install -Dm755 wasm-bindgen-*/wasm-bindgen
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix/bin/wasm-bindgen
      - install -Dm755 wasm-bindgen-*/wasm-bindgen-test-runner
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix/bin/wasm-bindgen-test-runner ||
        true
      - tar xf rust-1.99.1-*.tar.xz
      - ./rust-1.99.1-*/install.sh --prefix=$FLATPAK_BUILDER_BUILDDIR/.rust
        --without=rust-docs --disable-ldconfig
      - tar xf rust-std-1.99.1-wasm32-unknown-unknown.tar.xz
      - cp -r
        rust-std-1.99.1-wasm32-unknown-unknown/rust-std-wasm32-unknown-unknown/lib/rustlib/wasm32-unknown-unknown
        $FLATPAK_BUILDER_BUILDDIR/.rust/lib/rustlib/wasm32-unknown-unknown
      - SKIP_PLATFORM_VARIANT=1 pnpm run build:modules
      - pnpm run package
      - node scripts/build-scaffold.ts /app --name open-orpheus --desktop-name
        io.github.yucling.open-orpheus --icon-app-name
        io.github.yucling.open-orpheus --app-path /lib/open-orpheus --icons-path
        /share/icons/hicolor --desktop-path /share/applications --symlink-path
        /bin/open-orpheus --with-zypak-wrapper
      - install -d /app/lib/open-orpheus
      - cp -r out/open-orpheus-linux-*/. /app/lib/open-orpheus/
      - install -Dm644 packaging/flatpak/metainfo.xml
        /app/share/metainfo/io.github.yucling.open-orpheus.metainfo.xml
    sources:
      - generated-node-sources.json
      - type: file
        url: https://registry.npmjs.org/pnpm/-/pnpm-12.18.0.tgz
        sha512: 9d7882d5dc82147ecfc4e062aa34834e0ad0296710a1837a1115ae012127d36b7109e321ac1598a1dd0a65597681b1e99917e12ed0d749eae91187943363beb3
        dest-filename: pnpm-12.18.0.tgz
      - type: file
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.18.0.tgz
        sha512: 389f97db072b6a5742c23ef9a4221ead601141246975f8f47814ecff6383ca17de5b8eb294e9e34c813f18aadae8c9fa13bdbf8019974bc8a0ad48a86be17d7d
        dest-filename: pnpm-exe-x86_64.tgz
        only-arches:
          - x86_64
      - type: file
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.18.0.tgz
        sha512: d9da725410874fe15fa6e421f62fbb31702a35660b0af0f9bd8af9a7a1229b1a206bc5122e78db520ca3ef600eaced218dce6b8b74c414fde38b20478e4499a5
        dest-filename: pnpm-exe-aarch64.tgz
        only-arches:
          - aarch64
      - generated-cargo-sources.json
      - type: file
        url: https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
        sha256: 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
        dest-filename: wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
        only-arches:
          - x86_64
      - type: file
        url: https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-aarch64-unknown-linux-gnu.tar.gz
        sha256: cc8dd8e90aa9111758168d30c63a14b7f0276997d9d60d3e160a1fb5e7d3b919
        dest-filename: wasm-bindgen-0.2.130-aarch64-unknown-linux-gnu.tar.gz
        only-arches:
          - aarch64
      - type: file
        url: https://static.rust-lang.org/dist/rust-1.99.1-x86_64-unknown-linux-gnu.tar.xz
        sha256: 231fcae47ee950621374725b5fc3b5441d2fbda2955ac45dd7dc816d8876cfe7
        dest-filename: rust-1.99.1-x86_64-unknown-linux-gnu.tar.xz
        only-arches:
          - x86_64
      - type: file
        url: https://static.rust-lang.org/dist/rust-1.99.1-aarch64-unknown-linux-gnu.tar.xz
        sha256: a48fb1e853be56ce9b8e2751f5464dbd5e16440cd81e237920f3a5e7e806333e
        dest-filename: rust-1.99.1-aarch64-unknown-linux-gnu.tar.xz
        only-arches:
          - aarch64
      - type: file
        url: https://static.rust-lang.org/dist/rust-std-1.99.1-wasm32-unknown-unknown.tar.xz
        sha256: 5f628f857dd00a8aa3fcac2e275665d2782066a5795274ed124c5b560f46423c
        dest-filename: rust-std-1.99.1-wasm32-unknown-unknown.tar.xz
      - type: archive
        url: https://github.com/YUCLing/open-orpheus/archive/refs/tags/v0.20.0.tar.gz
        sha256: 4d57ac2f5122e3e9a0b200c84f0b4e046d27dbb2a1a7addedc121c0884e73bc7
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
