app-id: io.github.yucling.open-orpheus
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: electron-wrapper
separate-locales: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: open-orpheus
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/run/build/open-orpheus/.npm-prefix/bin:/run/build/open-orpheus/.rust/bin
      env:
        XDG_CACHE_HOME: /run/build/open-orpheus/flatpak-node/cache
        ELECTRON_OFFLINE_BUILD: "1"
    build-commands:
      - mkdir -p .cargo
      - cp cargo/config .cargo/config.toml
      - "echo 'minimumReleaseAge: 0' >> pnpm-workspace.yaml"
      - npm install -g --ignore-scripts --omit=optional --no-audit --no-fund
        --offline --no-update-notifier --prefix
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix ./pnpm-12.8.1.tgz
      - install -d
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix/lib/node_modules/@pnpm/exe.linux-$(node
        -p process.arch)
      - tar xf pnpm-exe-*.tgz -C
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix/lib/node_modules/@pnpm/exe.linux-$(node
        -p process.arch) --strip-components=1
      - node
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix/lib/node_modules/pnpm/install.js
      - pnpm install --offline --frozen-lockfile --store-dir
        $FLATPAK_BUILDER_BUILDDIR/flatpak-node/pnpm-store
      - tar xf wasm-bindgen-*.tar.gz
      - install -Dm755 wasm-bindgen-*/wasm-bindgen
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix/bin/wasm-bindgen
      - install -Dm755 wasm-bindgen-*/wasm-bindgen-test-runner
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix/bin/wasm-bindgen-test-runner ||
        true
      - tar xf cargo-zigbuild-*.tar.xz
      - install -Dm755 cargo-zigbuild-*/cargo-zigbuild
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix/bin/cargo-zigbuild
      - tar xf zig-*.tar.xz
      - mv zig-*-linux-*/ $FLATPAK_BUILDER_BUILDDIR/.zig
      - ln -sf $FLATPAK_BUILDER_BUILDDIR/.zig/zig
        $FLATPAK_BUILDER_BUILDDIR/.npm-prefix/bin/zig
      - tar xf rust-1.96.0-*.tar.xz
      - ./rust-1.96.0-*/install.sh --prefix=$FLATPAK_BUILDER_BUILDDIR/.rust
        --without=rust-docs --disable-ldconfig
      - tar xf rust-std-1.96.0-wasm32-unknown-unknown.tar.xz
      - cp -r
        rust-std-1.96.0-wasm32-unknown-unknown/rust-std-wasm32-unknown-unknown/lib/rustlib/wasm32-unknown-unknown
        $FLATPAK_BUILDER_BUILDDIR/.rust/lib/rustlib/wasm32-unknown-unknown
      - pnpm run build:modules
      - pnpm run package
      - node scripts/build-scaffold.ts /app --name open-orpheus --desktop-name
        io.github.yucling.open-orpheus --icon-app-name
        io.github.yucling.open-orpheus --app-path /lib/open-orpheus --icons-path
        /share/icons/hicolor --desktop-path /share/applications --symlink-path
        /bin/open-orpheus --with-zypak-wrapper
      - install -d /app/lib/open-orpheus
      - cp -r out/open-orpheus-linux-*/. /app/lib/open-orpheus/
      - install -Dm644 packaging/flatpak/metainfo.xml
        /app/share/metainfo/io.github.yucling.open-orpheus.metainfo.xml
    sources:
      - generated-node-sources.json
      - type: file
        url: https://registry.npmjs.org/pnpm/-/pnpm-12.8.1.tgz
        sha512: f64ba907507f5ceafe06c8d38e6052d0179444580ec1279ddd5bfc11cb48aa8a2644b66598e07e761da84872a9fc57d5f902b87fa49d024198d558612aabbe45
        dest-filename: pnpm-12.8.1.tgz
      - type: file
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.8.1.tgz
        sha512: f1b0d9d2566509d8b6aef9c5ba5ec4620702ef329e5927bbeb2f09576a17a1b692f29f62f5de8f49fe8b80bb533347c8ed1f4e87878b09bbde5f2343326bd9fa
        dest-filename: pnpm-exe-x86_64.tgz
        only-arches:
          - x86_64
      - type: file
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.8.1.tgz
        sha512: ab8b3d6bd5f63b737d69e505a285b6e28acdaf1beedb4fa3c9550547945a9cf0aa38a28f06b82cda2cb0324041c75697924cdd593e78fe67f3f017bcb0995613
        dest-filename: pnpm-exe-aarch64.tgz
        only-arches:
          - aarch64
      - generated-cargo-sources.json
      - type: file
        url: https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
        sha256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
        dest-filename: wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
        only-arches:
          - x86_64
      - type: file
        url: https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-aarch64-unknown-linux-gnu.tar.gz
        sha256: 1797c349a0f45d30946e8986b184135e12839ab576c9a04203e85febfc5dcb35
        dest-filename: wasm-bindgen-0.2.129-aarch64-unknown-linux-gnu.tar.gz
        only-arches:
          - aarch64
      - type: file
        url: https://static.rust-lang.org/dist/rust-1.96.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: c295047583a56238ea06b43f849f4b877fa12bfd4c7103f8d9a74c94c9c4e108
        dest-filename: rust-1.96.0-x86_64-unknown-linux-gnu.tar.xz
        only-arches:
          - x86_64
      - type: file
        url: https://static.rust-lang.org/dist/rust-1.96.0-aarch64-unknown-linux-gnu.tar.xz
        sha256: 371eadcca97062219cbd8593628eb5d2802bc370515d085fedce1b56b2baed57
        dest-filename: rust-1.96.0-aarch64-unknown-linux-gnu.tar.xz
        only-arches:
          - aarch64
      - type: file
        url: https://static.rust-lang.org/dist/rust-std-1.96.0-wasm32-unknown-unknown.tar.xz
        sha256: 5a360604f50aaf62320bd2201f6e97113bbdb2a93881c66889dd90cdbaab51a0
        dest-filename: rust-std-1.96.0-wasm32-unknown-unknown.tar.xz
      - type: file
        url: https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.4/cargo-zigbuild-x86_64-unknown-linux-gnu.tar.xz
        sha256: 6b69963040818ca1ef573d8135a95aa902e17cf7f873c32c6426642dadfe7f59
        dest-filename: cargo-zigbuild-x86_64-unknown-linux-gnu.tar.xz
        only-arches:
          - x86_64
      - type: file
        url: https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.4/cargo-zigbuild-aarch64-unknown-linux-gnu.tar.xz
        sha256: 25cf2cdc6cde848b33a761ff2cf46d1efe6ba7e1adfc4b6f3ee2d570cacb5419
        dest-filename: cargo-zigbuild-aarch64-unknown-linux-gnu.tar.xz
        only-arches:
          - aarch64
      - type: file
        url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        dest-filename: zig-x86_64-linux-0.16.0.tar.xz
        only-arches:
          - x86_64
      - type: file
        url: https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
        sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
        dest-filename: zig-aarch64-linux-0.16.0.tar.xz
        only-arches:
          - aarch64
      - type: archive
        url: https://github.com/YUCLing/open-orpheus/archive/refs/tags/v0.19.1.tar.gz
        sha256: 2d5d07cdb4a5edbbd47376850584dd209799bb6133b4587da6875cd930341448
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
